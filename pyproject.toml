[project]
name = "overhear"
version = "0.1.0"
description = "Speculative-retrieval voice RAG over MSMARCO-XI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "websockets>=13.0",
    "httpx[http2]>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "fastembed>=0.4",
    "hnswlib>=0.8",
    "datasets>=3.0",
    "numpy>=1.26",
    "python-multipart>=0.0.12",
    "orjson>=3.10",
]

[tool.uv]
package = false
